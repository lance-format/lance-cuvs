name: Rust Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: rust-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  CARGO_TARGET_DIR: /__w/lance-cuvs/lance-cuvs/backends/cuvs_26_02/target-manylinux_2_28

jobs:
  rust-quality:
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ./tools/bootstrap_build_env.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Use bundled Python 3.12
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Check Rust formatting
        run: just rust-fmt-check

      - name: Run Clippy
        run: just rust-clippy

      - name: Run cargo check
        run: just rust-check
