name: Python Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  CARGO_TARGET_DIR: /__w/lance-cuvs/lance-cuvs/backends/cuvs_26_02/target-manylinux_2_28

jobs:
  build-wheels:
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ./tools/bootstrap_build_env.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Use bundled Python 3.12
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Build release wheels
        run: just build-wheels

      - uses: actions/upload-artifact@v4
        with:
          name: python-release-dist
          path: dist/*

  publish:
    needs:
      - build-wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-release-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
